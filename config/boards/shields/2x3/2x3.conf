# No EC11 encoder on this shield, so the driver is not enabled.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth/USB device name. Without this the name is empty and the device
# advertises anonymously, so it never shows up as "2x3" when pairing.
CONFIG_ZMK_KEYBOARD_NAME="2x3"

# USB CDC ACM debug logging. This selects LOG + USB CDC ACM + CONSOLE so ZMK
# log output can be watched on /dev/cu.usbmodem* while testing.
CONFIG_ZMK_USB_LOGGING=y
