CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth/USB device name. Without this the name is empty and the device
# advertises anonymously, so it never shows up as "3x3" when pairing.
CONFIG_ZMK_KEYBOARD_NAME="3x3"

# ZMK Studio: live keymap editing over USB from https://zmk.studio.
# The transport (CDC ACM UART + overlay node) is in 3x3.overlay, and the physical
# layout has the `keys` positions Studio requires.
CONFIG_ZMK_STUDIO=y

# USB CDC ACM debug logging, so keymap/scan behaviour can be watched on
# /dev/cu.usbmodem* while testing. This is a second CDC ACM instance alongside
# Studio's; macOS exposes both. Drop it for the battery-powered build.
CONFIG_ZMK_USB_LOGGING=y

# Implied by the studio-rpc-usb-uart snippet, spelled out so the shield also
# builds correctly if the snippet is ever re-added or build.sh changes.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
